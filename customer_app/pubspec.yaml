name: customer_app
description: "Teffe's Artisanal Fresh Butchery Customer Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Networking & REST API
  dio: ^5.4.3+1

  # Local Persistence
  shared_preferences: ^2.2.3

  # Fonts & Typography (Plus Jakarta Sans & Inter)
  google_fonts: ^6.2.1

  # Caching Images & SVG
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1

  # Utility & Formatting
  intl: ^0.19.0
  share_plus: ^13.3.0

  # Product Video Playback (Direct MP4 & YouTube Embeds)
  video_player: ^2.8.2
  youtube_player_iframe: ^6.0.2
  url_launcher: ^6.3.2
  geolocator: ^14.0.3
  google_maps_flutter: ^2.10.0
  socket_io_client: ^3.0.2
  razorpay_flutter: ^1.3.7

  # Firebase & Push Notifications & Auth
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  firebase_auth: ^5.4.4
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
