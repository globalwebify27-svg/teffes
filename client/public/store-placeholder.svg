<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="subtleDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>

  <!-- Centered Store Silhouette Graphic -->
  <g transform="translate(300, 195)" filter="url(#subtleDrop)">
    <!-- Soft circular backdrop ring -->
    <circle cx="0" cy="0" r="85" fill="#ffffff" opacity="0.7"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#cbd5e1" stroke-width="2" opacity="0.6"/>

    <!-- Building Roof / Pediment / House top -->
    <path d="M-55,-15 L0,-58 L55,-15 Z" fill="#94a3b8"/>
    <!-- Overhang eaves -->
    <path d="M-62,-15 L62,-15" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Store Awning Stripes -->
    <path d="M-50,-13 L-50,-2 C-50,6 -35,6 -35,-2 C-35,6 -20,6 -20,-2 C-20,6 -5,6 -5,-2 C-5,6 10,6 10,-2 C10,6 25,6 25,-2 C25,6 40,6 40,-2 C40,6 50,6 50,-2 L50,-13 Z" fill="#64748b"/>
    <!-- Alternating awning ribs -->
    <path d="M-35,-13 L-35,0 M-5,-13 L-5,0 M25,-13 L25,0" stroke="#475569" stroke-width="2.5" opacity="0.3"/>

    <!-- Building Main Body -->
    <rect x="-46" y="2" width="92" height="58" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>

    <!-- Shop Front Door -->
    <rect x="-14" y="24" width="28" height="36" rx="2" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="8" cy="42" r="2" fill="#64748b"/>

    <!-- Left & Right Display Windows -->
    <rect x="-40" y="16" width="20" height="24" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="-30" y1="16" x2="-30" y2="40" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="-40" y1="28" x2="-20" y2="28" stroke="#94a3b8" stroke-width="1.2"/>

    <rect x="20" y="16" width="20" height="24" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="30" y1="16" x2="30" y2="40" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="20" y1="28" x2="40" y2="28" stroke="#94a3b8" stroke-width="1.2"/>

    <!-- Ground Baseline -->
    <rect x="-70" y="60" width="140" height="3" rx="1.5" fill="#94a3b8"/>
  </g>

  <!-- Clean textual indicator -->
  <text x="300" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="1.5">
    TEFFE'S OUTLET
  </text>
</svg>
